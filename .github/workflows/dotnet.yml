name: Build e testes
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AulaFlow.slnx
      - run: dotnet build AulaFlow.slnx -c Release --no-restore
      - run: dotnet test AulaFlow.slnx -c Release --no-build
